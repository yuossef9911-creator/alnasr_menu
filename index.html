<!doctype html>

<head>

<style>
*{box-sizing:border-box}body{margin:0;background:#050707;color:#fff;font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:14px}.hero img{width:100%;display:block;border-radius:18px}
.note{margin:14px 0;padding:14px;border:1px solid #d9a928;border-radius:14px;background:#0b0d0d;text-align:center;color:#f4c84a}
.menu{display:grid;gap:14px}.card{border:1px solid #d9a928;border-radius:16px;padding:16px;background:linear-gradient(145deg,#111414,#050606)}
h2{margin:0 0 10px;color:#f4c84a;font-size:22px}.item{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px dotted #777}.item:last-child{border:0}
.price{color:#f4c84a;white-space:nowrap}.wa{position:fixed;bottom:18px;right:18px;background:#25d366;color:#071107;text-decoration:none;font-weight:bold;padding:13px 18px;border-radius:30px;box-shadow:0 5px 20px #000;font-size:16px}
.small{color:#ccc;font-size:13px;text-align:center;margin:18px}
</style>
</head>
<body>
<div class="wrap">

<script>

["المشاوي",["كباب مشوي","كباب دجاج","كباب لحم","كفتة مشوية","شيش لحم","شيش دجاج","مشاوي مشكلة"]],
["المقبلات والسلطات",["كبة نية","كبة مشوية","تبولة","حمص","متبل","سلطة خضراء","سلطة يونانية","فول","فتة","بطاطا مقلية"]],
